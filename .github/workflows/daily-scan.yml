name: Daily backend scan

# Modus operandi: the backend scans every day, the app just displays it.
# This job refreshes configs/offers.json and stamps each card config, then
# commits the result. The app pulls the fresh configs on launch.
on:
  schedule:
    # ~8:05 AM Eastern (12:05 UTC). After the DST switch this is ~7:05 AM EST.
    - cron: "5 12 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the scan
        run: python3 backend/scan_offers.py

      - name: Commit updated configs
        run: |
          git config user.name "card-scanner-bot"
          git config user.email "card-scanner-bot@users.noreply.github.com"
          git add configs/
          git diff --cached --quiet || git commit -m "Daily backend scan: $(date -u +%F)"
          git push
